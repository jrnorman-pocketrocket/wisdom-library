<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Wisdom Library</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0f0f0f;
    --surface:   #1a1a1a;
    --border:    #2a2a2a;
    --text:      #e8e4dc;
    --muted:     #777;
    --green:     #4a7c59;
    --green-dim: #2a4a35;
    --blue:      #3a6b9e;
    --blue-dim:  #1e3d5e;
    --brown:     #8b6340;
    --brown-dim: #4a3320;
    --purple:    #6b4fa0;
    --purple-dim:#3a2860;
    --teal:      #2a8a7e;
    --teal-dim:  #164840;
    --radius:    12px;
    --card-pad:  18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* ── HEADER ── */
  .header {
    padding: 28px 16px 0;
    text-align: center;
  }
  .header h1 {
    font-family: 'Lora', serif;
    font-size: 1.7rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  .header p {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  /* ── SEARCH ── */
  .search-wrap {
    padding: 16px 16px 0;
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
  }
  .search-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 300;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-wrap input::placeholder { color: var(--muted); }
  .search-wrap input:focus { border-color: #444; }

  /* ── TABS ── */
  .tabs-wrap {
    overflow-x: auto;
    padding: 12px 16px 0;
    scrollbar-width: none;
  }
  .tabs-wrap::-webkit-scrollbar { display: none; }
  .tabs {
    display: flex;
    gap: 8px;
    width: max-content;
  }
  .tab {
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.82rem;
    font-weight: 400;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    letter-spacing: 0.01em;
  }
  .tab:hover { color: var(--text); border-color: #444; }

  .tab.active[data-tab="Devotionals"]  { background: var(--green-dim);  border-color: var(--green);  color: #8ecfa4; }
  .tab.active[data-tab="Mark Moss"]    { background: var(--blue-dim);   border-color: var(--blue);   color: #7ab3e0; }
  .tab.active[data-tab="Dan Martell"]  { background: var(--brown-dim);  border-color: var(--brown);  color: #c4956a; }
  .tab.active[data-tab="AI"]           { background: var(--purple-dim); border-color: var(--purple); color: #b09de0; }
  .tab.active[data-tab="Business"]     { background: var(--teal-dim);   border-color: var(--teal);   color: #5ecfc4; }

  /* ── STATUS ── */
  .status {
    text-align: center;
    padding: 48px 16px;
    color: var(--muted);
    font-size: 0.85rem;
  }

  /* ── CARDS ── */
  .cards {
    padding: 14px 16px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: var(--card-pad);
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: #3a3a3a; }

  /* accent strip */
  .card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
  }
  .card[data-tab="Devotionals"]::before  { background: var(--green); }
  .card[data-tab="Mark Moss"]::before    { background: var(--blue); }
  .card[data-tab="Dan Martell"]::before  { background: var(--brown); }
  .card[data-tab="AI"]::before           { background: var(--purple); }
  .card[data-tab="Business"]::before     { background: var(--teal); }

  .card-date {
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .card-title {
    font-family: 'Lora', serif;
    font-size: 1rem;
    font-weight: 600;
    line-height: 1.35;
    color: var(--text);
    margin-bottom: 8px;
  }

  .card-summary {
    font-size: 0.83rem;
    line-height: 1.6;
    color: #aaa;
    margin-bottom: 10px;
  }

  .card-scripture {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 10px;
    padding-left: 10px;
    border-left: 2px solid var(--border);
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 10px;
  }
  .tag {
    font-size: 0.68rem;
    padding: 3px 8px;
    border-radius: 4px;
    letter-spacing: 0.03em;
    text-transform: lowercase;
  }
  .card[data-tab="Devotionals"]  .tag { background: var(--green-dim);  color: #8ecfa4; }
  .card[data-tab="Mark Moss"]    .tag { background: var(--blue-dim);   color: #7ab3e0; }
  .card[data-tab="Dan Martell"]  .tag { background: var(--brown-dim);  color: #c4956a; }
  .card[data-tab="AI"]           .tag { background: var(--purple-dim); color: #b09de0; }
  .card[data-tab="Business"]     .tag { background: var(--teal-dim);   color: #5ecfc4; }

  .find-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }
  .find-btn:hover { color: var(--text); border-color: #555; }

  /* ── POPUP ── */
  .popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .popup-overlay.open { display: flex; }
  .popup {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 16px 16px 0 0;
    padding: 24px 20px 36px;
    width: 100%;
    max-width: 600px;
  }
  .popup h3 {
    font-family: 'Lora', serif;
    font-size: 1rem;
    margin-bottom: 6px;
    color: var(--text);
  }
  .popup p {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .popup-search {
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    padding: 12px 14px;
    width: 100%;
    margin-bottom: 12px;
    word-break: break-all;
    cursor: text;
    outline: none;
    resize: none;
    min-height: 60px;
  }
  .popup-actions { display: flex; gap: 8px; }
  .btn-copy {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    border: none;
    background: #333;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-copy:hover { background: #444; }
  .btn-close {
    padding: 11px 18px;
    border-radius: 8px;
    border: 1px solid #333;
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
  }

  /* ── COUNT ── */
  .count-bar {
    padding: 10px 16px 0;
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="header">
  <h1>Wisdom Library</h1>
  <p>Your personal knowledge archive</p>
</div>

<div class="search-wrap">
  <input type="search" id="searchInput" placeholder="Search titles, summaries, tags…" autocomplete="off">
</div>

<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab active" data-tab="Devotionals">📖 Devotionals</button>
    <button class="tab" data-tab="Mark Moss">📈 Mark Moss</button>
    <button class="tab" data-tab="Dan Martell">🚀 Dan Martell</button>
    <button class="tab" data-tab="AI">🤖 AI</button>
    <button class="tab" data-tab="Business">💼 Business</button>
  </div>
</div>

<div class="count-bar" id="countBar"></div>
<div id="cards" class="cards"></div>
<div id="status" class="status">Loading…</div>

<!-- Gmail search popup -->
<div class="popup-overlay" id="popup">
  <div class="popup">
    <h3>Find in Gmail</h3>
    <p>Copy this search string and paste it into Gmail's search bar.</p>
    <textarea class="popup-search" id="popupText" readonly></textarea>
    <div class="popup-actions">
      <button class="btn-copy" id="copyBtn">Copy to clipboard</button>
      <button class="btn-close" onclick="closePopup()">Close</button>
    </div>
  </div>
</div>

<script>
const TABS = {
  'Devotionals': {
    url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9pJVqSfaxBxr3XHVxUJSrd2fbp30Afip4RG2ijzRTS1zLbbGshIlbzSgUd2Vejcamu1KAQxA591Au/pub?gid=19034336&single=true&output=csv',
    color: 'var(--green)'
  },
  'Mark Moss': {
    url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9pJVqSfaxBxr3XHVxUJSrd2fbp30Afip4RG2ijzRTS1zLbbGshIlbzSgUd2Vejcamu1KAQxA591Au/pub?gid=1138198135&single=true&output=csv',
    color: 'var(--blue)'
  },
  'Dan Martell': {
    url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9pJVqSfaxBxr3XHVxUJSrd2fbp30Afip4RG2ijzRTS1zLbbGshIlbzSgUd2Vejcamu1KAQxA591Au/pub?gid=2002495787&single=true&output=csv',
    color: 'var(--brown)'
  },
  'AI': {
    url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9pJVqSfaxBxr3XHVxUJSrd2fbp30Afip4RG2ijzRTS1zLbbGshIlbzSgUd2Vejcamu1KAQxA591Au/pub?gid=363328701&single=true&output=csv',
    color: 'var(--purple)'
  },
  'Business': {
    url: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9pJVqSfaxBxr3XHVxUJSrd2fbp30Afip4RG2ijzRTS1zLbbGshIlbzSgUd2Vejcamu1KAQxA591Au/pub?gid=185710635&single=true&output=csv',
    color: 'var(--teal)'
  }
};

let currentTab = 'Devotionals';
let allData = {};
let searchQuery = '';

// ── CSV PARSER ──────────────────────────────────────────────
function parseCSV(text) {
  const rows = [];
  const lines = text.split('\n');
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const cols = [];
    let inQuote = false, cur = '';
    for (let c = 0; c < line.length; c++) {
      const ch = line[c];
      if (ch === '"') {
        if (inQuote && line[c+1] === '"') { cur += '"'; c++; }
        else inQuote = !inQuote;
      } else if (ch === ',' && !inQuote) {
        cols.push(cur); cur = '';
      } else {
        cur += ch;
      }
    }
    cols.push(cur);
    if (cols.length >= 2 && cols[0]) rows.push(cols);
  }
  return rows;
}

// ── FETCH TAB ───────────────────────────────────────────────
async function fetchTab(tabKey) {
  if (allData[tabKey]) return allData[tabKey];
  const url = TABS[tabKey].url;
  try {
    const res = await fetch(url);
    const text = await res.text();
    allData[tabKey] = parseCSV(text);
    return allData[tabKey];
  } catch(e) {
    return [];
  }
}

// ── RENDER ──────────────────────────────────────────────────
function renderCards(rows, tabKey) {
  const container = document.getElementById('cards');
  const status    = document.getElementById('status');
  const countBar  = document.getElementById('countBar');
  container.innerHTML = '';

  const q = searchQuery.toLowerCase();
  const filtered = q
    ? rows.filter(r => r.join(' ').toLowerCase().includes(q))
    : rows;

  if (filtered.length === 0) {
    status.style.display = 'block';
    status.textContent = rows.length === 0 ? 'No entries yet.' : 'No results for "' + searchQuery + '"';
    countBar.textContent = '';
    return;
  }

  status.style.display = 'none';
  countBar.textContent = filtered.length + ' ' + (filtered.length === 1 ? 'entry' : 'entries');

  filtered.forEach(row => {
    const [date, title, tags, summary, scripture, gmailUrl] = row;
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.tab = tabKey;

    let tagsHtml = '';
    if (tags) {
      tagsHtml = '<div class="card-tags">' +
        tags.split(',').map(t => `<span class="tag">${t.trim()}</span>`).join('') +
        '</div>';
    }

    const scriptureHtml = scripture
      ? `<div class="card-scripture">${scripture}</div>` : '';

    const btnHtml = gmailUrl
      ? `<button class="find-btn" onclick="showPopup('${escapeAttr(gmailUrl)}')">Find in Gmail</button>` : '';

    card.innerHTML = `
      <div class="card-date">${date || ''}</div>
      <div class="card-title">${title || '(untitled)'}</div>
      ${summary ? `<div class="card-summary">${summary}</div>` : ''}
      ${scriptureHtml}
      ${tagsHtml}
      ${btnHtml}
    `;
    container.appendChild(card);
  });
}

function escapeAttr(str) {
  return str.replace(/'/g, '&#39;').replace(/"/g, '&quot;');
}

// ── LOAD & SWITCH TAB ────────────────────────────────────────
async function loadTab(tabKey) {
  currentTab = tabKey;
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tabKey);
  });

  const status = document.getElementById('status');
  const cards  = document.getElementById('cards');
  status.style.display = 'block';
  status.textContent = 'Loading…';
  cards.innerHTML = '';
  document.getElementById('countBar').textContent = '';

  const rows = await fetchTab(tabKey);
  renderCards(rows, tabKey);
}

// ── SEARCH ──────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', async function() {
  searchQuery = this.value.trim();
  const rows = await fetchTab(currentTab);
  renderCards(rows, currentTab);
});

// ── TAB CLICKS ──────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    searchQuery = '';
    document.getElementById('searchInput').value = '';
    loadTab(btn.dataset.tab);
  });
});

// ── POPUP ───────────────────────────────────────────────────
function showPopup(url) {
  // Extract the Gmail search string from the URL
  try {
    const match = url.match(/#search\/(.+)$/);
    const searchStr = match
      ? decodeURIComponent(match[1])
      : decodeURIComponent(url.split('?q=')[1] || url);
    document.getElementById('popupText').value = searchStr;
  } catch(e) {
    document.getElementById('popupText').value = url;
  }
  document.getElementById('popup').classList.add('open');
}

function closePopup() {
  document.getElementById('popup').classList.remove('open');
}

document.getElementById('popup').addEventListener('click', function(e) {
  if (e.target === this) closePopup();
});

document.getElementById('copyBtn').addEventListener('click', function() {
  const text = document.getElementById('popupText').value;
  navigator.clipboard.writeText(text).then(() => {
    this.textContent = 'Copied!';
    setTimeout(() => this.textContent = 'Copy to clipboard', 1800);
  });
});

// ── INIT ────────────────────────────────────────────────────
loadTab('Devotionals');
</script>
</body>
</html>
